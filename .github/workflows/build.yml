name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build release APK
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: gradle assembleRelease --no-daemon

      - name: Publish release for in-app update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CODE=$((1000 + ${{ github.run_number }}))
          cp app/build/outputs/apk/release/*.apk itachi-universe.apk
          gh release create "v$CODE" itachi-universe.apk \
            --title "Version 1.0.${{ github.run_number }}" \
            --notes "New version of Itachi Universe." --latest

      - uses: actions/upload-artifact@v4
        with:
          name: itachi-universe-apk
          path: app/build/outputs/apk/release/*.apk
