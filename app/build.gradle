plugins {
    id "com.android.application"
}

android {
    namespace "com.itachi.universe"
    compileSdk 34

    defaultConfig {
        // Same id as the old Flutter app, so this APK installs over it.
        applicationId "com.itachi.itachi_universe"
        minSdk 24
        targetSdk 34
        def run = System.getenv("RUN_NUMBER") ?: "1"
        versionCode run.toInteger()
        versionName "1.0.${run}"
        buildConfigField "String", "DEFAULT_BASE_URL", "\"https://itachi-backend.onrender.com\""
    }

    // Fixed signing key (the Android ID / Device ID depends on it).
    signingConfigs {
        fixed {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.fixed }
        release {
            signingConfig signingConfigs.fixed
            minifyEnabled false
        }
    }

    buildFeatures { buildConfig true }

    // Lint can crash or complain about Media3 opt-in APIs; it does not change the APK.
    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(":youtubeplayer")
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "com.google.android.material:material:1.12.0"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"
    implementation "androidx.security:security-crypto:1.1.0-alpha06"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "com.google.code.gson:gson:2.10.1"
    implementation "androidx.media3:media3-exoplayer:1.3.1"
    implementation "androidx.media3:media3-exoplayer-hls:1.3.1"
    implementation "androidx.media3:media3-ui:1.3.1"
}
